server {
    listen 80;
    listen [::]:80;
    server_name texas.francisdlm.cn;

    root /var/www/texas;
    index index.html;

    # 安全：禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存（游戏文件几乎不变）
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    access_log /var/log/nginx/texas.access.log;
    error_log  /var/log/nginx/texas.error.log;
}
